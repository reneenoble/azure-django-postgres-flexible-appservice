name: Trigger auto deployment for container-app-e6e33joy5xb5e

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'src/**'
    - '.github/workflows/container-app-e6e33joy5xb5e-AutoDeployTrigger-e45e4852-1a1b-48f1-87dc-bf34978aeaf3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CONTAINERAPPE6E33JOY5XB5E_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPE6E33JOY5XB5E_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPE6E33JOY5XB5E_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src 
          registryUrl: 
          registryUsername: ${{ secrets.CONTAINERAPPE6E33JOY5XB5E_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERAPPE6E33JOY5XB5E_REGISTRY_PASSWORD }}
          containerAppName: container-app-e6e33joy5xb5e
          resourceGroup: azuredjangopostgresflexibleappservice874a
          imageToBuild: default/container-app-e6e33joy5xb5e:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


